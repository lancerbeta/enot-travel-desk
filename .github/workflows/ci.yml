name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Canonical unit suite
        run: python -m unittest tests.test_a0_a1_mechanics tests.test_a0_a1_seams
