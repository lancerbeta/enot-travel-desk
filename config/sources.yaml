schema_version: 0.3.0
status: ROUTING_PRIOR_NOT_WHITELIST_NOT_LIVE_INVENTORY
reviewed_at: '2026-09-30'
policy: 'The registry is a routing prior for the owner. It is not a closed whitelist,
  not a price database, and not permission to book or pay. A useful primary source
  may be read before it is added here. Trip prices and inventory stay in trip Evidence,
  never in this file.

  '
layers:
  stable_registry: runtime_sources
  capability_observations: capability_observations
  trip_evidence: not_stored_here
refresh:
  scheduled_crawler: false
  when:
  - on_use_if_unknown
  - after_observed_failure
  - before_enabling_api_or_mcp
  - after_material_provider_doc_change
  - occasional_manual_sweep_only_if_drift_matters
families:
  air:
    includes:
    - flights
    baseline: air.public_web
    direct: air.carrier_or_seller
    fallback: air.public_web_alternate
    accelerators:
    - air.aviasales_data_api
    - air.duffel_offers
    if_still_insufficient: UNKNOWN
  ground:
    includes:
    - rail
    - bus
    - ferry
    baseline: ground.public_web
    direct: ground.operator_direct
    fallback: ground.public_web_alternate
    accelerators: []
    if_still_insufficient: UNKNOWN
  stays:
    includes:
    - lodging
    baseline: stays.public_web
    direct: stays.property_direct
    fallback: stays.public_web_alternate
    accelerators:
    - stays.partner_api
    if_still_insufficient: UNKNOWN
  packages:
    includes:
    - package_baseline
    baseline: packages.public_web
    direct: packages.operator_direct
    fallback: packages.public_web_alternate
    accelerators: []
    if_still_insufficient: UNKNOWN
  activities:
    includes:
    - guides
    - events
    baseline: activities.public_web
    direct: activities.operator_direct
    fallback: activities.public_web_alternate
    accelerators:
    - activities.listing_page
    if_still_insufficient: UNKNOWN
  local_discovery:
    includes:
    - creators
    - reviews
    baseline: local_discovery.editorial
    direct: local_discovery.operator_page
    fallback: local_discovery.public_web_alternate
    accelerators: []
    if_still_insufficient: UNKNOWN
  official_rules:
    includes:
    - entry
    - safety
    - payment_constraints
    baseline: official_rules.primary_authority
    direct: official_rules.primary_authority
    fallback: official_rules.alternate_authority
    accelerators: []
    if_still_insufficient: UNKNOWN
  maps:
    includes:
    - local_operations
    - weather_for_visit_day
    baseline: maps.public_links
    direct: maps.official_local
    fallback: maps.public_web_alternate
    accelerators: []
    if_still_insufficient: UNKNOWN
