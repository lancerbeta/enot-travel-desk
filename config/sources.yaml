on_demand_routes:
- id: airline_direct
  when: chosen_flight
  resolve: official airline or ticket seller page for exact itinerary
  requires: verify host identity, scope, dates, baggage, terms
- id: stay_direct
  when: chosen_lodging
  resolve: official property or authorized seller
  requires: rooms/beds/party/check-in/taxes/cancel and actual offer
- id: entry_and_transit
  when: international_trip
  resolve: destination/transit immigration authority and official consular sources
  requires: passport/residence/visa facts supplied by traveler, travel date; no inferred
    entitlement
- id: health_and_emergency
  when: selected_guide
  resolve: official emergency/health authority and chosen insurer
  requires: logistics and contact verification; not diagnosis or guarantee of coverage
- id: local_transport_events_weather
  when: selected_destination_dates
  resolve: official local operators/venues/weather providers
  requires: actual visit date, service area, timetable or supported forecast horizon
capability_observations:
- id: OBS-2026-09-30-CURSOR-DEV
  plane: development_executor
  not_clean_traveler_pilot: true
  host_label: Cursor local agent on Windows
  observed_at: '2026-09-30'
  method_version: 0.2.1
  scope: fixed pilot brief A0A1-PILOT-BRIEF-01, not a personal trip
  channels:
    search: available_snippets_only
    primary_page_read: unavailable
    calculation: available
    files: available
    zip: not_created
    delegation: not_used
  documentary_vs_live: Search snippets are not read conditions. No supplier page body was read. Local arithmetic and file export are separate from travel inventory.
  notes: WebSearch on 2026-09-30 returned third-party pages about RZD and Kazan trains. Those snippets were not used as offers and do not apply to 2026-10-16. WebFetch of https://www.rzd.ru/ and https://kazan.dzvr.ru/ was blocked by session tool policy before a page body was returned. One alternate read was not completed. Gap remains — no primary transport or lodging terms for the brief. This observation does not transfer to a clean cloud chat.
